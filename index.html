  <body class="bg-[#F8F7F2] text-[#20252D] antialiased selection:bg-[#F2B84B]/30 selection:text-[#14213D]">
    <div id="root"></div>
    <script>
      // Proteksi Keamanan: Blokir Klik Kanan & DevTools
      document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
      });
      document.addEventListener("keydown", function (e) {
        var isCtrl = e.ctrlKey || e.metaKey;
        if (
          e.key === "F12" ||
          e.keyCode === 123 ||
          (isCtrl && e.shiftKey && ["I", "i", "J", "j", "C", "c"].indexOf(e.key) !== -1) ||
          (isCtrl && ["U", "u"].indexOf(e.key) !== -1)
        ) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
